<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Drive | Join Game</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="center-page join-page">
    <div class="narrow" style="width:100%">
      <h1 class="brand">Grammar Drive</h1>
      <p class="brand-sub">OPEN ROAD CHALLENGE</p>

      <section class="panel">
        <!-- shown while connecting -->
        <div id="loadingView" class="status-card">
          <p class="pulse">Connecting…</p>
        </div>

        <!-- no link / bad link / problems -->
        <div id="noticeView" class="status-card hidden">
          <div class="big" id="noticeTitle"></div>
          <p id="noticeText" class="muted"></p>
        </div>

        <!-- join form: name + class only -->
        <form id="joinForm" class="hidden">
          <h2>Join the game</h2>
          <p class="muted" id="sessionInfo"></p>
          <label for="studentName">Your name</label>
          <input id="studentName" type="text" maxlength="40" required autocomplete="name" placeholder="e.g. Ploy S.">
          <label for="classSection">Class / Section</label>
          <input id="classSection" type="text" maxlength="30" required placeholder="e.g. M.5/2">
          <button id="joinButton" class="block" type="submit">Join Game</button>
          <p class="small muted" style="margin-top:12px">Please check your name and class before joining. Only your teacher can change them afterwards.</p>
        </form>

        <!-- after joining -->
        <div id="joinedView" class="status-card hidden">
          <p id="joinedName" class="muted"></p>
          <div class="big" id="statusTitle"></div>
          <p id="statusText" class="muted"></p>
          <div class="timer" id="studentTimer"></div>
          <a id="playButton" class="button block hidden" href="./play.html">🚗 Enter the Track</a>
        </div>

        <div id="message" class="message hidden"></div>
      </section>
    </div>
  </main>

  <script type="module" src="./js/student.js"></script>
</body>
</html>
