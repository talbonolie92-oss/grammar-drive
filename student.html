
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Drive | Join Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 480px;
      padding: 28px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
    }
    h1 { margin-top: 0; color: white; }
    p { color: #94a3b8; line-height: 1.5; }
    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
    }
    input {
      color: white;
      background: #0f172a;
      border: 1px solid #475569;
    }
    button {
      margin-top: 22px;
      color: white;
      background: #2563eb;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .message {
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    .hidden { display: none; }
    .success { background: #14532d; color: white; }
    .error { background: #7f1d1d; color: white; }
    .lobby {
      margin-top: 20px;
      padding: 18px;
      border: 1px solid #2563eb;
      border-radius: 10px;
      background: #0f172a;
    }
    .lobby h2 { color: #60a5fa; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Grammar Drive</h1>
    <p>Open Road Challenge</p>
    <p>Enter your classroom session details to join the game.</p>

    <form id="joinForm">
      <label for="sessionCode">Session Code</label>
      <input
        id="sessionCode"
        type="text"
        maxlength="6"
        placeholder="Enter 6-character code"
        required
        autocomplete="off"
      >

      <label for="studentName">Your Name</label>
      <input
        id="studentName"
        type="text"
        maxlength="40"
        placeholder="Enter your name"
        required
        autocomplete="name"
      >

      <label for="classSection">Class / Section</label>
      <input
        id="classSection"
        type="text"
        maxlength="30"
        placeholder="Example: 12A"
        required
      >

      <button id="joinButton" type="submit">Join Game</button>
    </form>

    <div id="message" class="message hidden"></div>

    <section id="lobby" class="lobby hidden">
      <h2>You're in the Lobby!</h2>
      <p id="welcomeMessage"></p>
      <p>You've joined successfully. Please wait for your teacher to start the game.</p>
      <p><strong>Status: Waiting for teacher</strong></p>
    </section>
  </main>

  <script type="module" src="./js/student.js"></script>
</body>
</html>
