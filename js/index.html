
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Drive | Connection Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .panel {
      width: min(90%, 420px);
      padding: 30px;
      box-sizing: border-box;
      background: #1e293b;
      border-radius: 16px;
      text-align: center;
    }

    h1 { color: #60a5fa; }

    button {
      padding: 13px 22px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 22px;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Grammar Drive</h1>
    <p>Firebase Connection Test</p>

    <button id="testButton">Test Firebase Connection</button>

    <div id="status">Waiting for test...</div>
  </main>

  <script type="module">
    import {
      auth,
      signInAnonymously,
      signOut
    } from "./js/firebase.js";

    const button = document.getElementById("testButton");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Connecting to Firebase...";

      try {
        const result = await signInAnonymously(auth);
        const uid = result.user.uid;

        await signOut(auth);

        status.innerHTML =
          "<strong>SUCCESS!</strong><br>" +
          "Firebase Authentication is working.<br>" +
          "Anonymous sign-in tested successfully.";

        console.log("Test UID:", uid);

      } catch (error) {
        console.error(error);

        status.textContent =
          "CONNECTION FAILED: " + error.code +
          " — " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
