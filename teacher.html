<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Drive | Teacher Dashboard</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- Login -->
  <main id="loginView" class="center-page">
    <div class="narrow">
      <h1 class="brand">Grammar Drive</h1>
      <p class="brand-sub">TEACHER DASHBOARD</p>
      <section class="panel">
        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="username">
          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password">
          <button id="loginButton" class="block" type="submit">Teacher Login</button>
        </form>
        <div id="loginMessage" class="message hidden"></div>
      </section>
      <p class="small"><a href="./index.html">← Home</a></p>
    </div>
  </main>

  <!-- Dashboard -->
  <main id="dashboardView" class="container hidden">
    <div class="row" style="margin-bottom:16px">
      <div>
        <h1 class="brand" style="margin:0">Grammar Drive</h1>
        <div class="muted small" id="teacherInfo"></div>
      </div>
      <div class="spacer"></div>
      <button id="logoutButton" class="secondary" type="button">Log Out</button>
    </div>

    <div id="rulesWarning" class="message warn hidden"></div>
    <div id="dashMessage" class="message hidden"></div>

    <div class="grid-2">
      <!-- Left column: create + my sessions -->
      <div>
        <section class="panel">
          <h2>New game session</h2>
          <form id="createForm">
            <label for="grade">Grade level</label>
            <select id="grade" required>
              <option value="10">Grade 10</option>
              <option value="11">Grade 11</option>
              <option value="12">Grade 12</option>
            </select>

            <label>Grammar topics</label>
            <div class="topic-list" id="topicList"></div>

            <label for="duration">Session duration</label>
            <select id="duration" required></select>

            <label class="check" style="margin-top:14px">
              <input id="allowLateJoin" type="checkbox">
              Allow students to join after the game starts
            </label>

            <button id="createButton" class="block" type="submit">Create Game Session</button>
          </form>
        </section>

        <section class="panel">
          <h2>My sessions</h2>
          <div id="sessionList" class="session-list"><p class="muted">Loading…</p></div>
        </section>
      </div>

      <!-- Right column: selected session -->
      <div id="sessionPanel">
        <section class="panel"><p class="muted">Create a session, or choose one from "My sessions".</p></section>
      </div>
    </div>
  </main>

  <div id="projector" class="projector hidden"></div>
  <div id="modalRoot"></div>

  <script type="module" src="./js/teacher.js"></script>
</body>
</html>
