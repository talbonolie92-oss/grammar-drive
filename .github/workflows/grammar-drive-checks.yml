name: Grammar Drive static checks

on:
  pull_request:
  push:
    branches:
      - main
      - performance/optimization-3.0

permissions:
  contents: read

jobs:
  syntax-and-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Validate Firebase rules JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('database.rules.json', 'utf8')); console.log('database.rules.json is valid JSON')"
